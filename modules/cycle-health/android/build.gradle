plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'com.liambic.cyclehealth'
version = '1.0.0'
android {
  namespace 'com.liambic.cyclehealth'
  defaultConfig {
    minSdkVersion 26
    versionCode 1
    versionName '1.0.0'
  }
}
dependencies {
  implementation 'androidx.health.connect:connect-client:1.1.0'
}
