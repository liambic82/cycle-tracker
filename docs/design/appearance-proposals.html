        mode: 'system',
        background: 'plain',
        strength: 25,
      },
      botanical: {
        theme: 'sage',
        mode: 'system',
        background: 'wash',
        strength: 25,
      },
      compact: {
        theme: 'ocean',
        mode: 'system',
        background: 'plain',
        strength: 25,
      },
    };
    const settings = Object.fromEntries(
      directions.map((id) => [
        id,
        {
          ...defaults[id],
          page: 'calendar',
          selected: 9,
          flow: 'None',
          monthOpen: false,
          notice: 'Design proposal · fictional records · changes stay in this preview.',

    const preview = { device: 'desktop' };
    let heightFrame;
    function sizeStages() {
      cancelAnimationFrame(heightFrame);
      heightFrame = requestAnimationFrame(() => {
        const stages = directions.map((id) => root.querySelector(`[data-direction="${id}"]`));
        const width = root.getBoundingClientRect().width;
        let height = 0;
        stages.forEach((stage) => {
          const measure = stage.cloneNode(true);
          measure.setAttribute('aria-hidden', 'true');
          measure.inert = true;
          Object.assign(measure.style, {
            position: 'absolute',
            visibility: 'hidden',
            pointerEvents: 'none',
            width: `${width}px`,
            minHeight: '0',
            top: '0',
            left: '0',
          });
          root.append(measure);
          height = Math.max(height, measure.getBoundingClientRect().height);
          measure.remove();
        });
        stages.forEach((stage) => (stage.style.minHeight = `${Math.ceil(height)}px`));
      });
    }
    function restore(saved) {
      const state = saved?.modelContent;
      if (!state || state.kind !== 'cycle-appearance-proposals') return;
      if (['phone', 'desktop'].includes(state.device)) preview.device = state.device;
      directions.forEach((id) => {
        const incoming = state.choices?.[id];
        if (!incoming) return;
        for (const [key, allowed] of Object.entries({
          theme: ['plum', 'sage', 'ocean'],
          mode: ['system', 'light', 'dark'],
          background: ['plain', 'wash', 'image'],
        })) {
          if (allowed.includes(incoming[key])) settings[id][key] = incoming[key];
        }
        if (Number.isFinite(incoming.strength))
          settings[id].strength = Math.max(0, Math.min(60, incoming.strength));
      });
    }
    restore(window.openai?.widgetState);
    function persist() {
      const choices = Object.fromEntries(
        directions.map((id) => [
          id,
          Object.fromEntries(
            ['theme', 'mode', 'background', 'strength'].map((key) => [key, settings[id][key]]),
          ),
        ]),
      );
      window.openai
        ?.setWidgetState?.({
          modelContent: {
            kind: 'cycle-appearance-proposals',
            device: preview.device,
            choices,
          },
          privateContent: null,
        })
        .catch(() => {});
    }
    const icon = (name) => `<i data-lucide="${name}" aria-hidden="true"></i>`;
    const button = (label, attrs = '', klass = '') =>
      `<button type="button" class="ct-button cursor-interaction ${klass}" ${attrs}>${label}</button>`;
    function nav(s) {
      return [
        ['calendar', 'calendar-days', 'Calendar'],
        ['history', 'chart-no-axes-combined', 'Your history'],
        ['medications', 'pill', 'Medications'],
        ['data', 'sliders-horizontal', 'Your data'],
      ]
        .map(
          ([id, ic, label]) =>
            `<button type="button" class="ct-nav-button cursor-interaction" data-page="${id}" aria-pressed="${s.page === id || (s.page === 'day' && id === 'calendar')}">${icon(ic)}<span>${label}</span></button>`,
        )
        .join('');
    }
    const brand = `<div class="ct-brand"><span class="ct-brand-mark">${icon('flower-2')}</span>Cycle.</div>`;
    function calendar(s, id) {
      let cells = '<span></span>'.repeat(4);
      for (let d = 1; d <= 31; d++) {
        const kind =
          d <= 3 ? 'bleed' : d === 4 ? 'spotting' : [5, 6, 7, 8, 9].includes(d) ? 'no-flow' : '';
        const status =
          kind === 'bleed'
            ? 'recorded flow'
            : kind === 'spotting'
              ? 'spotting'
              : kind === 'no-flow'
                ? 'no flow'
                : 'not logged';
        cells += `<button type="button" class="cursor-interaction ${kind ? 'ct-' + kind : ''} ${s.selected === d ? 'ct-selected' : ''}" data-day="${d}" aria-label="October ${d}, ${status}" aria-pressed="${s.selected === d}"><small>${d <= 9 ? 'C' + (d + 2) : '·'}</small>${d}${kind === 'bleed' ? '<small>●</small>' : ''}</button>`;
      }
      const panel = `<div class="ct-row"><span class="ct-month-title">October 2026</span>${button('Today', 'data-today', 'ct-quiet')}</div><div class="ct-weekdays" aria-hidden="true">${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((v) => `<span>${v}</span>`).join('')}</div><div class="ct-calendar">${cells}</div><div class="ct-legend"><span><i class="ct-dot"></i>Flow</span><span><i class="ct-dot spot"></i>Spotting</span><span><i class="ct-dot none"></i>No flow</span><span><i class="ct-dot unknown"></i>Unlogged</span></div><p class="ct-footnote">C = recorded cycle day · Sample month</p>`;
      if (id === 'botanical' && !s.monthOpen)
        return `<section class="ct-panel ct-calendar-panel"><p class="ct-kicker">Your calendar</p><h3>October 2026</h3><p class="ct-small">Your recorded days, close at hand.</p><div class="ct-gap">${button(icon('calendar-days') + ' Open month', 'data-open-month', 'ct-wide')}</div></section>`;
      return `<section class="ct-panel ct-calendar-panel"><div class="ct-chips" aria-label="Calendar view">${['Year', 'Month', 'Day'].map((view) => `<button type="button" class="ct-chip cursor-interaction" data-view="${view}" aria-pressed="${view === 'Month'}">${view}</button>`).join('')}</div><div class="ct-gap">${panel}</div></section>`;
    }
    function selected(s, id) {
      const logged = s.selected === 9;
      const flow =
        s.selected <= 3
          ? 'Medium recorded'
          : s.selected === 4
            ? 'Spotting'
            : s.selected <= 9
              ? 'None recorded'
              : 'Not logged';
      return `<section class="ct-panel ct-selected-panel"><div class="ct-row"><p class="ct-kicker">${logged ? 'Today’s journal' : 'Selected day'}</p>${button(icon('ellipsis'), 'data-entry-options aria-label="Entry options"', 'ct-quiet')}</div><h3>October ${s.selected}</h3><p class="ct-small">${s.selected <= 9 ? 'Recorded cycle day ' + (s.selected + 2) : 'Future day · no recorded cycle day'}</p><hr class="ct-divider"><div class="ct-detail-line"><span>Flow</span>${flow}</div><div class="ct-detail-line"><span>Symptoms</span>${logged ? 'Bloating' : 'Not logged'}</div><div class="ct-detail-line"><span>Phase</span>Not determined</div>${id === 'botanical' ? '<p class="ct-footnote">Make room for what you notice today.</p>' : ''}<div class="ct-gap">${button(icon('square-pen') + ' Open daily journal', 'data-page="day"', 'ct-primary ct-wide')}</div><p class="ct-footnote">Changes save as you log.</p></section>`;
    }
    function calendarPage(s, id) {
      const heading =
        id === 'compact'
          ? 'Your calendar'
          : id === 'botanical'
            ? 'A moment for yourself.'
            : 'Your days, together.';
      return `<header><p class="ct-kicker">Friday, October 9</p><div class="ct-row"><h1 class="ct-title">${heading}</h1>${button(icon('sliders-horizontal') + ' Appearance', 'data-page="data"')}</div>${id !== 'compact' ? '<p class="ct-sub">A little awareness. A little more care.</p>' : ''}</header>${id === 'botanical' ? '<div class="ct-journal-hero"><div><p class="ct-kicker">Recorded cycle day</p><strong>11</strong><p class="ct-small">Last start · September 29</p></div><div class="ct-leaf" aria-hidden="true"></div></div>' : '<div class="ct-summary"><span><b>Day 11</b> recorded</span><span>Last start <b>Sep 29</b></span></div>'}<div class="ct-workspace">${calendar(s, id)}${selected(s, id)}</div><div class="ct-link-row">${button(icon('book-open') + ' Cycle context', 'data-context="education"')}${button(icon('calendar-range') + ' Period estimate', 'data-context="estimate"')}</div>`;
    }
    function appearance(s) {
      const choice = (field, value, label, extra = '') =>
        `<button type="button" class="ct-chip cursor-interaction" data-choice="${field}" data-value="${value}" aria-pressed="${s[field] === value}">${extra}${label}</button>`;
      return `<header><p class="ct-kicker">Your data</p><h1 class="ct-title">Make it feel like you.</h1><p class="ct-sub">Appearance · proposed options</p></header><section class="ct-panel ct-settings"><div class="ct-form-row"><span class="ct-label">Color palette</span><div class="ct-chips">${[
        ['plum', 'Plum', '#684256'],
        ['sage', 'Sage', '#365d45'],
        ['ocean', 'Ocean', '#285f78'],
      ]
        .map(([v, l, c]) =>
          choice(
            'theme',
            v,
            l,
            `<span class="ct-swatch" style="--swatch:${c}" aria-hidden="true"></span>`,
          ),
        )
        .join(
          '',
        )}</div></div><div class="ct-form-row"><span class="ct-label">Appearance</span><div class="ct-chips">${['system', 'light', 'dark'].map((v) => choice('mode', v, v[0].toUpperCase() + v.slice(1))).join('')}</div></div><div class="ct-form-row"><span class="ct-label">Background</span><div class="ct-chips">${choice('background', 'plain', 'Plain')}${choice('background', 'wash', 'Soft wash')}${choice('background', 'image', 'Image example')}</div>${s.background === 'image' ? `<p class="ct-footnote">Illustrated placeholder for a personal photo. Text stays on solid surfaces.</p><div class="ct-gap">${button(icon('image') + ' Choose from this device', 'data-photo')}</div>` : ''}${s.background !== 'plain' ? `<div class="ct-gap"><label class="ct-label">Background visibility <output>${s.strength}%</output><input aria-label="Background visibility" type="range" min="0" max="60" step="5" value="${s.strength}" data-strength></label><p class="ct-small">Lower is quieter. Cards stay opaque.</p></div>` : ''}</div><p class="ct-small">Proposed storage: appearance stays on this device. Personal photos stay out of journal backups and reports.</p><div class="ct-setting-actions">${button('Preview calendar', 'data-page="calendar"', 'ct-primary')}${button('Reset appearance', 'data-reset')}</div></section><section class="ct-panel ct-settings"><div class="ct-row"><div><h3>Your journal, still yours.</h3><p class="ct-small">Backup, reports, and privacy controls stay here.</p></div>${icon('shield-check')}</div></section>`;
    }
    function daily(s) {
      return `${button(icon('arrow-left') + ' Calendar', 'data-page="calendar"', 'ct-quiet')}<header class="ct-gap"><div class="ct-row"><h1 class="ct-title">October ${s.selected}</h1>${button(icon('ellipsis'), 'data-entry-options aria-label="Entry options"', 'ct-quiet')}</div><p class="ct-sub">Your daily journal · fictional entry</p></header><section class="ct-panel ct-gap"><span class="ct-label">Flow</span><div class="ct-chips">${['None', 'Spotting', 'Light', 'Medium', 'Heavy'].map((v) => `<button type="button" class="ct-chip cursor-interaction" data-flow="${v}" aria-pressed="${s.flow === v}">${v}</button>`).join('')}</div><hr class="ct-divider"><span class="ct-label">How are you feeling?</span><div class="ct-chips">${['Bloating', 'Cramps', 'Fatigue'].map((v, i) => `<button type="button" class="ct-chip cursor-interaction" data-symptom="${v}" aria-pressed="${i === 0}">${v}</button>`).join('')}</div><div class="ct-gap">${button('Browse all symptoms', 'data-demo="Full symptom browser keeps its existing choices."', 'ct-quiet')}</div><hr class="ct-divider"><label class="ct-label">A note for yourself<textarea class="ct-textarea" aria-label="Fictional sample note" placeholder="Anything you want to remember…"></textarea></label><div class="ct-link-row">${button('Products & details', 'data-demo="Product and bleeding records keep their current fields."')}${button('Medication records', 'data-page="medications"')}</div></section><p class="ct-footnote">${icon('check')} App proposal: autosave status stays beside your entry. Preview changes are not saved.</p>`;
    }
    function historyPage() {
      return `<header><p class="ct-kicker">Your history</p><h1 class="ct-title">A picture of your patterns.</h1><p class="ct-sub">Recorded information · fictional sample</p></header><section class="ct-panel ct-gap"><h3>Cycle lengths</h3><p class="ct-small">Completed cycles · days</p>${[
        ['Jun 3', 30],
        ['Jul 3', 29],
        ['Aug 1', 30],
        ['Aug 31', 29],
      ]
        .map(
          ([d, n]) =>
            `<div class="ct-history-row"><span>${d}</span><div class="ct-bar-track"><div class="ct-bar" style="width:${(n / 35) * 100}%"></div></div><span>${n} days</span></div>`,
        )
        .join(
          '',
        )}<p class="ct-footnote">Incomplete cycles stay out of these statistics.</p></section><section class="ct-panel ct-gap"><h3>Recorded bleeding</h3><div class="ct-detail-line"><span>Last start</span>September 29</div><div class="ct-detail-line"><span>Recorded duration</span>5 days</div></section>`;
    }
    function medicationPage() {
      return `<header><p class="ct-kicker">Medications</p><h1 class="ct-title">A place for your routine.</h1><p class="ct-sub">Friday, October 9 · fictional sample</p></header><section class="ct-panel ct-gap"><h3>Today’s records</h3><div class="ct-med-row"><span class="ct-med-time">08:00</span><div class="ct-med-main">Sample supplement<p class="ct-small">1 sample tablet</p></div><span class="ct-small">${icon('check')} Taken</span></div><div class="ct-med-row"><span class="ct-med-time">PRN</span><div class="ct-med-main">Sample as-needed medicine<p class="ct-small">No dose recorded</p></div></div><div class="ct-gap">${button('Open dose records', 'data-demo="Dose recording keeps the existing Taken, Skipped, and Taken late choices."', 'ct-primary')}</div></section><section class="ct-panel ct-gap"><div class="ct-row"><h3>Reminders</h3>${icon('bell')}</div><p class="ct-small">Discreet notifications. Each medicine stays off until you choose to enable it.</p><div class="ct-gap">${button('Manage reminders', 'data-demo="Reminder settings keep their existing permission and scheduling behavior."')}</div></section>`;
    }
    function paint(stage, s) {
      stage.dataset.theme = s.theme;
      stage.dataset.background = s.background;
      stage.dataset.device = preview.device;
      stage.style.colorScheme = s.mode === 'system' ? 'inherit' : s.mode;
      stage.style.setProperty('--ct-image', String(s.strength / 100));
    }
    function render(id) {
      const s = settings[id],
        stage = root.querySelector(`[data-direction="${id}"]`),
        app = stage.querySelector('.ct-app');
      paint(stage, s);
      const page =
        s.page === 'data'
          ? appearance(s)
          : s.page === 'day'
            ? daily(s)
            : s.page === 'history'
              ? historyPage()
              : s.page === 'medications'
                ? medicationPage()
                : calendarPage(s, id);
      app.innerHTML = `<div class="ct-proposal-bar"><span>Design proposal · sample data</span><span>${id === 'familiar' ? 'Quiet familiar' : id === 'botanical' ? 'Botanical journal' : 'Clear and compact'}</span></div><div class="ct-shell"><aside class="ct-sidebar">${brand}<nav aria-label="App navigation">${nav(s)}</nav><div class="ct-lock">${button(icon('lock-keyhole') + ' Lock', 'data-demo="The existing passphrase and biometric lock behavior stays in place."', 'ct-quiet')}</div></aside><div class="ct-body"><div class="ct-mobile-header">${brand}${button(icon('sliders-horizontal'), 'data-page="data" aria-label="Appearance"', 'ct-quiet')}</div><main class="ct-content">${page}</main><nav class="ct-mobile-nav" aria-label="App navigation">${nav(s)}</nav></div></div><div class="ct-notice" role="status">${s.notice}</div>`;
      app.querySelectorAll('[data-page]').forEach((el) =>
        el.addEventListener('click', () => {
          s.page = el.dataset.page;
          render(id);
        }),
      );
      app.querySelectorAll('[data-day]').forEach((el) =>
        el.addEventListener('click', () => {
          s.selected = Number(el.dataset.day);
          s.flow =
            s.selected <= 3
              ? 'Medium'
              : s.selected === 4
                ? 'Spotting'
                : s.selected <= 9
                  ? 'None'
                  : '';
          render(id);
        }),
      );
      app.querySelectorAll('[data-today]').forEach((el) =>
        el.addEventListener('click', () => {
          s.selected = 9;
          s.flow = 'None';
          render(id);
        }),
      );
      app.querySelectorAll('[data-choice]').forEach((el) =>
        el.addEventListener('click', () => {
          s[el.dataset.choice] = el.dataset.value;
          render(id);
          persist();
        }),
      );
      app.querySelector('[data-strength]')?.addEventListener('input', (event) => {
        s.strength = Number(event.target.value);
        paint(stage, s);
        app.querySelector('output').textContent = s.strength + '%';
      });
      app.querySelector('[data-strength]')?.addEventListener('change', persist);
      app.querySelector('[data-reset]')?.addEventListener('click', () => {
        Object.assign(s, defaults[id]);
        render(id);
        persist();
      });
      app
        .querySelector('[data-photo]')
        ?.addEventListener('click', () =>
          notice('Photo picker is proposed. No files are accessed in this mockup.'),
        );
      app.querySelector('[data-open-month]')?.addEventListener('click', () => {
        s.monthOpen = true;
        render(id);
      });
      app.querySelectorAll('[data-view]').forEach((el) =>
        el.addEventListener('click', () => {
          if (el.dataset.view === 'Day') {
            s.page = 'day';
            render(id);
          } else
            notice(
              el.dataset.view === 'Year'
                ? 'The existing year overview stays available in the proposed app.'
                : 'Month view is shown in this proposal.',
            );
        }),
      );
      app
        .querySelectorAll('[data-entry-options]')
        .forEach((el) =>
          el.addEventListener('click', () =>
            notice(
              'Entry options stay beside the date. Delete remains here with confirmation, away from the entry footer.',
            ),
          ),
        );
      app
        .querySelectorAll('[data-context]')
        .forEach((el) =>
          el.addEventListener('click', () =>
            notice(
              el.dataset.context === 'education'
                ? 'The nine offline education topics keep their existing content.'
                : 'Experimental period estimates keep their existing opt-in and limits.',
            ),
          ),
        );
      app
        .querySelectorAll('[data-demo]')
        .forEach((el) => el.addEventListener('click', () => notice(el.dataset.demo)));
      app.querySelectorAll('[data-flow]').forEach((el) =>
        el.addEventListener('click', () => {
          s.flow = el.dataset.flow;
          render(id);
        }),
      );
      app
        .querySelectorAll('[data-symptom]')
        .forEach((el) =>
          el.addEventListener('click', () =>
            el.setAttribute('aria-pressed', String(el.getAttribute('aria-pressed') !== 'true')),
          ),
        );
      function notice(text) {
        s.notice = text;
        app.querySelector('.ct-notice').textContent = text;
      }
      if (globalThis.lucide) lucide.createIcons({ attrs: { width: 18, height: 18 } });
      sizeStages();
    }
    const renderAll = () => directions.forEach(render);
    renderAll();
    let lastWidth = 0;
    new ResizeObserver(([entry]) => {
      if (entry.contentRect.width !== lastWidth) {
        lastWidth = entry.contentRect.width;
        sizeStages();
      }
    }).observe(root);
    window.addEventListener('openai:set_globals', (event) => {
      if (event.detail?.globals?.widgetState) {
        restore(event.detail.globals.widgetState);
        renderAll();
      }
    });
    if (globalThis.Tweak) {
      const tweak = new Tweak({
        container: root,
        onChange: () => {
          renderAll();
          persist();
        },
      });
      tweak.addSelect(preview, 'device', {
        label: 'Preview size',
        options: [
          { label: 'Computer', value: 'desktop' },
          { label: 'Phone', value: 'phone' },
        ],
      });
    }
  })();
</script>
